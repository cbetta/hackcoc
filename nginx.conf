# Serves the site the way Netlify did: /about is about.html, /about/
# redirects to /about when about.html exists, and anything else is a file or
# a 404. On jiji, Caddy sits in front and Cloudflare does TLS.

map $sent_http_content_type $cache_control {
    ~^text/html  "public, max-age=0, must-revalidate";
    default      "public, max-age=86400";
}

server {
    listen 8080;
    root /srv/site;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # $stem is decoded, so it only becomes a Location once a file of that
    # name exists: a request can't smuggle a header in through it.
    location ~ ^(?<stem>.+)/$ {
        if (-f $document_root$stem.html) {
            return 301 $stem$is_args$args;
        }
        try_files ${uri}index.html =404;
    }
}
