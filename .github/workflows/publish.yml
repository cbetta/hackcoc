name: Publish to jiji

# Push to master -> CI (ci.yml) -> build the image and push it to
# ghcr.io/betta-apps/hackcoc -> jiji's pin timer pins it by tag and digest within
# about a minute, which deploys it. jiji holds no copy of the site, only
# which image it runs, so master here is always what hackcodeofconduct.org
# serves.
#
# Nothing here can write to cbetta/jiji: publish runs on jiji's walled-off CI
# runners, so the deploy key stays with jiji's own pin timer, which finds the
# new image through the moving :master tag and the io.betta.jiji.tag label.
# Actions are pinned by commit (their version in the comment).

on:
  push:
    branches: [master]
    # Only what goes into the image. A README change should not redeploy.
    paths:
      - "index.html"
      - "robots.txt"
      - "assets/**"
      - "nginx.conf"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Serialised: two pushes in quick succession must not race to move the tags.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A gate: jiji only ever gets an image that passed. pull-requests: read is
  # for ci.yml's merge job, which never runs here, but GitHub refuses a called
  # workflow that asks for more than it's given.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  publish:
    needs: ci
    runs-on: [self-hosted, jiji-ci]
    permissions:
      contents: read
      packages: write
    steps:
      # Its own Docker config: the jiji-ci runners share one HOME, so a shared
      # config.json would hand another repo's publish this job's GHCR login,
      # and its logout.
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      # History without old file contents: the timestamp below needs the log.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Every file in the image gets the time of the last commit that changed
      # the site, so an unchanged site builds to the same layer (nothing new
      # to upload or for jiji to download) and a changed one gets new ETags.
      - name: Tag and timestamp
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          epoch="$(git log -1 --format=%ct -- index.html robots.txt assets)"
          [[ "$epoch" =~ ^[0-9]+$ ]] || { echo "::error::no commit has changed the site"; exit 1; }
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The daemon's own BuildKit: the jiji-ci runners share one rootless Docker,
      # so a docker-container builder is shared state another job's cleanup
      # removes mid-build. The docker driver can't attest, hence no provenance.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          provenance: false
          context: .
          outputs: type=registry,rewrite-timestamp=true
          tags: |
            ghcr.io/betta-apps/hackcoc:${{ steps.meta.outputs.tag }}
            ghcr.io/betta-apps/hackcoc:master
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.betta.jiji.tag=${{ steps.meta.outputs.tag }}
