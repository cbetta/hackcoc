name: CI

# Every PR, and the gate publish.yml runs before building an image for jiji.
# scripts/check.sh and scripts/smoke.sh are what deps-factory runs too, so
# "green" means the same thing here, there and locally.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, jiji-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The link check is python3; the runner only promises git, curl, tar, jq and Docker.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3"
      - run: scripts/check.sh

  smoke:
    runs-on: [self-hosted, jiji-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/smoke.sh

  ci-complete:
    needs: [checks, smoke]
    runs-on: [self-hosted, jiji-ci]
    steps:
      - run: echo "All checks passed."

  # Merges deps-factory PRs labelled "automerge", and Dependabot patch/minor
  # updates, once every check has passed. The deps-factory App's token makes the
  # merge trigger publishing (a GITHUB_TOKEN merge would not). Actions updates
  # always wait for a person. Does nothing until the App's secrets exist.
  merge:
    needs: ci-complete
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'deps-factory/') ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: [self-hosted, jiji-ci]
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_APP: ${{ secrets.FACTORY_APP_ID != '' }}
    steps:
      - name: Read the Dependabot update
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FROM_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
        run: |
          merge=false
          if [ "$HAS_APP" != true ]; then
            reason="the deps-factory App's secrets aren't set yet"
          elif [ "$FROM_DEPENDABOT" = true ]; then
            case "$ECOSYSTEM:$UPDATE_TYPE" in
              github_actions:*) reason="Actions updates wait for a person" ;;
              # Same tags, new digests: every changed file is modified in place with its mode kept, and its bytes are the same before and after once each digest is a marker (so a pin can't be dropped, nothing can move, and a failed lookup refuses).
              docker:*|docker_compose:*)
                set -o pipefail
                merge=true
                mode() { gh api "repos/$GITHUB_REPOSITORY/git/trees/$1?recursive=1" --jq ".tree[] | select(.path == \"$2\") | .mode"; }
                norm() { gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$2?ref=$1" | sed -E 's/@sha256:[0-9a-f]{64}/@sha256:DIGEST/g' | sha256sum; }
                head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" || merge=false
                base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.sha)...$head" --jq .merge_base_commit.sha)" || merge=false
                files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | [.status, .filename] | @tsv')" || merge=false
                [ -n "$files" ] || merge=false
                while [ "$merge" = true ] && IFS=$'\t' read -r status file; do
                  [ "$status" = modified ] || { merge=false; break; }
                  ma="$(mode "$base" "$file")" && mb="$(mode "$head" "$file")" && [ -n "$ma" ] && [ "$ma" = "$mb" ] || { merge=false; break; }
                  a="$(norm "$base" "$file")" && b="$(norm "$head" "$file")" && [ "$a" = "$b" ] || { merge=false; break; }
                done <<< "$files"
                [ "$merge" = true ] || reason="it changes more than image digests" ;;
              *:version-update:semver-patch) merge=true ;;
              *:version-update:semver-minor)
                if [ "${NEW_VERSION%%.*}" = 0 ]; then reason="a 0.x minor can break"; else merge=true; fi ;;
              *) reason="${UPDATE_TYPE:-an unclassified update} waits for a person" ;;
            esac
          else
            pr="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isDraft,labels)"
            if jq -e '.isDraft' <<< "$pr" > /dev/null; then reason="it's a draft"
            elif jq -e 'any(.labels[]; .name == "automerge")' <<< "$pr" > /dev/null; then merge=true
            else reason="it isn't labelled automerge"; fi
          fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          if [ "$merge" = true ]; then echo "Merging."; else echo "Not merging: $reason."; fi

      - name: Get the App's token
        id: app
        if: steps.decide.outputs.merge == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD"
